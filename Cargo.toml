[package]
name = "bulwark"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.10.1"
eframe = "0.26.2" 
rfd = "0.14"
catppuccin-egui = "5.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef"] }
